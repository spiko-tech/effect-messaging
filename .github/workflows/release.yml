name: Release
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    services:
      rabbitmq:
        image: rabbitmq:4.3.6-management
        ports:
          - 5679:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.15.0-alpine
        ports:
          - 4222:4222
        options: --name nats
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Start JetStream
        run: |
          chmod a+x ${{ github.workspace }}/.github/workflows/nats-entrypoint.sh
          docker cp ${{ github.workspace }}/.github/workflows/nats-entrypoint.sh nats:/usr/local/bin/docker-entrypoint.sh
          docker restart nats
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm changeset-version
          publish-script: pnpm changeset-publish
          push-with-git-cli: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: "" # https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868
